name: ci

on:
  push:
  pull_request:

# A superseded pull-request run is cancelled. Every other run gets a group of
# its own: with the default queue a newer pending run cancels an older pending
# one, which would drop the CI result of a master commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a pull request needs the slow, non-required jobs. Only a
  # pull request whose changed files are all Markdown outside release/ skips
  # them; every push (so every master commit) runs everything. The required
  # `check (...)` jobs and the security jobs always run, so the ruleset's
  # required contexts are always reported. The outcome fails open: anything
  # other than an explicit `false` runs the jobs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only "$BASE...$HEAD")"
            other="$(printf '%s\n' "$changed" | grep -Ev '[.]md$' || true)"
            release="$(printf '%s\n' "$changed" | grep -E '^release/' || true)"
            if [ -n "$changed" ] && [ -z "$other" ] && [ -z "$release" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    strategy:
      fail-fast: false
      matrix:
        # The `name` of each entry is the JOB NAME, and the job names are the
        # required status-check contexts of the `protect-master` ruleset
        # ("check (windows-latest)", "check (ubuntu-latest)", "check
        # (macos-15)"). They must not change: a renamed context is never
        # reported, so every pull request to master would stay blocked.
        #
        # What changed is the RUNNER. `macos-15` is the macOS 15 ARM64
        # image, and so was `macos-latest` before it, so the earlier pin
        # (4c47625) moved from one ARM64 label to another and kept the same
        # capacity constraint. A job that cannot be given a runner is
        # cancelled after GitHub's acquisition retries ("The job was not
        # acquired by Runner of type hosted even after multiple attempts"),
        # which leaves the required context missing. `macos-15-intel` is the
        # same macOS 15 release on the separate x64 pool.
        #
        # macOS ARM64 is therefore no longer covered by this matrix. Restore
        # it as a SEPARATE, NON-REQUIRED workflow once the ARM64 pool
        # recovers; a `continue-on-error` matrix entry would report a
        # cancelled job as a pass, which is not acceptable evidence.
        include:
          - { name: windows-latest, runner: windows-latest }
          - { name: ubuntu-latest, runner: ubuntu-latest }
          - { name: macos-15, runner: macos-15-intel }
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Timeouts are 3x the longest of the last 10 successful runs, rounded up to
    # 5 minutes (here macos-15: 499 s). Without one a job may run for GitHub's
    # 6 h default: run 41669633876 held a macos-15 job until that limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Enforce public documentation boundary
        if: matrix.name == 'ubuntu-latest'
        env:
          BOUNDARY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          BOUNDARY_HEAD: ${{ github.sha }}
        run: |
          base="$BOUNDARY_BASE"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git merge-base origin/master "$BOUNDARY_HEAD")"
          fi
          bash security/check-public-doc-boundary.sh "$base" "$BOUNDARY_HEAD"
          bash security/check-public-doc-boundary.test.sh
          bash security/check-public-doc-boundary-outgoing.test.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cargo's offline dependency audit can need package sources for
      # platform-specific lockfile entries. Provision them here; this is CI
      # build tooling only, and Riltra core remains network-free at runtime.
      - name: Fetch locked sources for dependency audit
        run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --locked
      - name: Test core suite and offline dependency audit
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked
      - run: cargo run -q -p riltra -- --help
      - run: cargo run -q -p riltra -- --version
      - run: cargo run -q -p riltra -- status

  # Source-build preflight for the default-off semantic-knowledge graph.
  # Native inference with pinned model and telemetry-off ONNX Runtime source
  # is exercised by semantic-native.yml on the native x64 runners.
  semantic-knowledge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-latest, runner: windows-latest }
          - { name: ubuntu-latest, runner: ubuntu-latest }
          - { name: macos-15, runner: macos-15-intel }
    name: semantic-knowledge (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked sources for offline optional dependency audit
        run: cargo fetch --locked
      - name: Install pinned protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-33.5.zip'
          $root = Join-Path $env:RUNNER_TEMP 'protoc-33.5'
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v33.5/protoc-33.5-win64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne '7e3468cd1fbd1ae9361a5304d4ac28fbd593aa1a425b5464bd9d4da5fca224b4') { throw "protoc archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $root 'bin')
          $version = & (Join-Path $root 'bin/protoc.exe') --version
          if ($version -ne 'libprotoc 33.5') { throw "unexpected protoc version: $version" }
      - name: Install pinned protoc (Linux and macOS Intel)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=protoc-33.5-linux-x86_64.zip
              expected=24e58fb231d50306ee28491f33a170301e99540f7e29ca461e0e80fd1239f8d1 ;;
            macOS)
              asset=protoc-33.5-osx-x86_64.zip
              expected=7f31625f8bec4929082ae9209e101c1c03692624457cc6332f83736db495ee92 ;;
            *) echo "unsupported protoc runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v33.5/$asset" -o "$archive"
          if [[ "$RUNNER_OS" == macOS ]]; then
            actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          else
            actual="$(sha256sum "$archive" | awk '{print $1}')"
          fi
          [[ "$actual" == "$expected" ]] || { echo "protoc archive SHA-256 mismatch: $actual" >&2; exit 1; }
          root="$RUNNER_TEMP/protoc-33.5"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
          [[ "$("$root/bin/protoc" --version)" == 'libprotoc 33.5' ]]
      # Step limits sit above the slowest observed green run (24 min, macOS Intel)
      # so a hang is cut in 40 min instead of waiting for the 60 min job limit.
      - name: Check all optional-feature targets
        timeout-minutes: 40
        run: cargo check --locked --no-default-features --features semantic-knowledge --all-targets
      - name: Lint all optional-feature targets
        timeout-minutes: 40
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --locked --no-default-features --features semantic-knowledge --all-targets -- -D warnings
      - name: Test local asset validation and embedding contract
        timeout-minutes: 40
        run: cargo test --locked --no-default-features --features semantic-knowledge --bin riltra inference::tests
      - name: Test knowledge vector lifecycle
        shell: bash
        run: |
          set -euo pipefail
          args=(--locked --no-default-features --features semantic-knowledge --bin riltra)
          listed="$(cargo test "${args[@]}" knowledge_vector::tests -- --list | tr -d '\r')"
          for name in \
            knowledge_vector::tests::builds_only_active_heads_without_changing_canonical_data \
            knowledge_vector::tests::semantic_vector_query_returns_ranked_candidates_without_writing \
            knowledge_vector::tests::semantic_query_falls_back_when_the_model_truncates_the_input \
            knowledge_vector::tests::semantic_search_reports_missing_lock_in_existing_cache_as_unavailable \
            knowledge_vector::tests::model_fingerprint_revalidation_distinguishes_unavailable_from_changed; do
            if ! printf '%s\n' "$listed" | grep -Fx "$name: test"; then
              echo "required knowledge vector regression test is missing or ignored: $name" >&2
              exit 1
            fi
          done
          cargo test "${args[@]}" knowledge_vector::tests
      - name: Test R2c semantic search and CLI/MCP parity
        shell: bash
        run: |
          set -euo pipefail
          args=(--locked --no-default-features --features semantic-knowledge)
          run_exact() {
            local test_name="$1"
            shift
            local listed
            listed="$(cargo test "${args[@]}" "$@" "$test_name" -- --list | tr -d '\r')"
            if ! printf '%s\n' "$listed" | grep -Fx "$test_name: test"; then
              echo "required R2c regression test is missing or ignored: $test_name" >&2
              exit 1
            fi
            cargo test "${args[@]}" "$@" "$test_name" -- --exact
          }
          run_exact knowledge_store::tests::semantic_candidates_revalidate_active_heads_kind_and_exact_evidence_path --bin riltra
          run_exact knowledge_search::tests::semantic_request_validation_matches_lexical_bounds --bin riltra
          run_exact response::tests::semantic_search_reports_passage_embedding_truncation_per_hit --bin riltra
          run_exact semantic_search_explicitly_falls_back_to_lexical_without_local_model --test knowledge
          run_exact t2_knowledge_search_matches_cli_missing_empty_populated_paging_and_escaping --test mcp
      - name: Test packet parity with optional feature graph
        shell: bash
        run: |
          set -euo pipefail
          args=(--locked --no-default-features --features semantic-knowledge)
          run_exact() {
            local test_name="$1"
            shift
            local listed
            listed="$(cargo test "${args[@]}" "$@" "$test_name" -- --list | tr -d '\r')"
            if ! printf '%s\n' "$listed" | grep -Fx "$test_name: test"; then
              echo "required packet regression test is missing: $test_name" >&2
              exit 1
            fi
            cargo test "${args[@]}" "$@" "$test_name" -- --exact --include-ignored
          }
          run_exact packet_mcp_matches_cli_document --test mcp
          run_exact packet_mcp_enforces_anchor_bytes_and_disables_retrieval --test mcp
          run_exact packet_duplicate_selectors_keep_outcomes_and_share_source --test packet
          run_exact response::tests::packet_context_omission_is_explicit --bin riltra
          run_exact response::tests::packet_follow_up_survives_truncation --bin riltra
          run_exact response::tests::context_render_state_preserves_legacy_bytes --bin riltra
      - name: Test deterministic MCP JSON with optional feature graph
        run: cargo test --locked --no-default-features --features semantic-knowledge --bin riltra mcp_structured_json_is_recursively_sorted_for_core_byte_compatibility
      - name: Test deterministic JSON key ordering with optional feature graph
        shell: bash
        run: |
          set -euo pipefail
          test_name='json::tests::sorts_nested_json_objects_without_reordering_arrays'
          cargo test --locked --no-default-features --features semantic-knowledge --bin riltra "$test_name" -- --list | tr -d '\r' | grep -Fx "$test_name: test"
          cargo test --locked --no-default-features --features semantic-knowledge --bin riltra "$test_name" -- --include-ignored --exact
      - name: Test deterministic LSP JSON ordering with optional feature graph
        shell: bash
        run: |
          set -euo pipefail
          test_name='lsp::tests::framing_uses_sorted_object_keys_with_nested_values'
          cargo test --locked --no-default-features --features semantic-knowledge --bin riltra "$test_name" -- --list | tr -d '\r' | grep -Fx "$test_name: test"
          cargo test --locked --no-default-features --features semantic-knowledge --bin riltra "$test_name" -- --include-ignored --exact
      - name: Test deterministic context JSON ordering with optional feature graph
        shell: bash
        run: |
          set -euo pipefail
          test_name='r1_context_reports_scoped_impact_and_unavailable_knowledge'
          cargo test --locked --no-default-features --features semantic-knowledge --test edges "$test_name" -- --list | tr -d '\r' | grep -Fx "$test_name: test"
          cargo test --locked --no-default-features --features semantic-knowledge --test edges "$test_name" -- --include-ignored --exact
      - name: Test deterministic MCP tool schemas with optional feature graph
        run: cargo test --locked --no-default-features --features semantic-knowledge --bin riltra tool_schemas_keep_core_key_order
      - name: Test Stage 2 integration targets with optional feature graph
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features semantic-knowledge \
            --test overview --test start --test agent_setup
      - name: Test Stage 2 public flows and MCP contracts with optional feature graph
        shell: bash
        run: |
          set -euo pipefail
          args=(--locked --no-default-features --features semantic-knowledge)

          run_exact() {
            local test_name="$1"
            shift
            local listed
            listed="$(cargo test "${args[@]}" "$@" "$test_name" -- --list | tr -d '\r')"
            if ! printf '%s\n' "$listed" | grep -Fx "$test_name: test"; then
              echo "required Stage 2 regression test is missing: $test_name" >&2
              exit 1
            fi
            cargo test "${args[@]}" "$@" "$test_name" -- --exact --include-ignored
          }

          run_exact mcp_modern_metadata_reaches_list_tools_handler --test mcp
          run_exact project_overview_mcp_matches_cli_document --test mcp
          run_exact project_overview_mcp_2026_07_28_matches_cli_document --test mcp
          run_exact mcp_tools_list_advertises_the_twenty_one_tools --test mcp
          run_exact mcp_tools_list_2026_07_28_advertises_twenty_one_tools_with_cache_hints --test mcp
          run_exact mcp_project_map_matches_cli --test mcp
          run_exact mcp_project_map_rejects_bad_input --test mcp
          run_exact mcp_project_map_no_index_creates_nothing --test mcp
          run_exact change_checks_mcp_matches_cli_document --test mcp
          run_exact change_checks_mcp_no_index_is_read_only --test mcp
          run_exact change_checks_mcp_rejects_unknown_field --test mcp
          run_exact docs_scan_mcp_matches_cli_document --test mcp
          run_exact docs_scan_mcp_creates_no_store --test mcp
          run_exact docs_scan_mcp_rejects_unknown_field --test mcp
          run_exact docs_scan_mcp_refuses_a_path_outside_the_repository --test mcp
          run_exact start::tests::terminal_policy_requires_both_streams --bin riltra
          run_exact start::tests::client_selection_does_not_authorize_writes --bin riltra
          run_exact start::tests::registration_and_index_require_confirmation --bin riltra
          run_exact agent_setup::tests::opencode_inspection_never_invokes_cli --bin riltra
          run_exact agent_setup::tests::apply_requires_confirmation_and_rechecks_plan --bin riltra
          run_exact overview::tests::collect_never_uses_semantic_retrieval --bin riltra
          run_exact agent_block_matches_the_agent_setup_snippet --test cli
      - name: Verify and test both dependency audits offline
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          audit_args=(--locked --no-default-features --features semantic-knowledge --test semantic)
          listed="$(cargo test "${audit_args[@]}" -- --list)"
          for name in \
            new_dependencies_are_audited_for_core_graph \
            new_semantic_dependencies_are_audited_for_feature_graph; do
            if ! printf '%s\n' "$listed" | tr -d '\r' | grep -Fqx "$name: test"; then
              echo "required dependency-audit test is missing or ignored: $name" >&2
              exit 1
            fi
          done
          cargo test "${audit_args[@]}" new_dependencies_are_audited_for_core_graph -- --exact --include-ignored
          cargo test "${audit_args[@]}" new_semantic_dependencies_are_audited_for_feature_graph -- --exact --include-ignored
      - name: Check release documents with optional feature graph
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo run --locked --no-default-features --features semantic-knowledge --example release_docs -- --check
      - name: Test release document failure paths with optional feature graph
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --no-default-features --features semantic-knowledge --example release_docs

  # Phase A of M10 Task 5: a native archive from this commit, installed and
  # checked on each native x64 runner. It complements the `check` matrix and
  # does not replace release-candidate.yml or create a release. The job names
  # are deliberately new: the required `check (...)` contexts stay unchanged.
  installer-phase-a:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-2025, runner: windows-2025, platform: windows-x64, ext: zip }
          - { name: ubuntu-24.04, runner: ubuntu-24.04, platform: linux-x64, ext: tar.gz }
          - { name: macos-15-intel, runner: macos-15-intel, platform: macos-x64, ext: tar.gz }
    name: installer (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.runner }}
    # Same rule as `check`: macos-15-intel took at most 732 s.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked sources for complete SBOM and notices
        run: cargo fetch --locked
      - name: Release build
        run: cargo build --release --locked -p riltra
      - name: Release documents match the locked dependency graph
        run: cargo run --locked -q --example release_docs -- --check
      - name: Package
        shell: bash
        run: bash release/package.sh "${{ matrix.platform }}" "${{ matrix.ext }}"
      - name: Installer Phase A (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem -LiteralPath dist -Filter *.zip | Select-Object -First 1).FullName
          pwsh -NoProfile -File release/test-install.ps1 -ArchivePath $archive
      - name: Installer Phase A (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive=
          for candidate in dist/riltra-*.tar.gz; do archive=$candidate; break; done
          bash release/test-install.sh --archive "$archive"

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies against RustSec
        run: cargo audit --file Cargo.lock

  security:
    runs-on: ubuntu-latest
    # Same rule as `check`: at most 30 s.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_BIN: ${{ github.workspace }}/bin/gitleaks
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks 8.30.1
        run: |
          mkdir -p "$PWD/bin"
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$PWD/bin" gitleaks
      - name: Scan changed commits
        if: github.event_name == 'pull_request'
        run: security/scan.sh range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
      - name: Scan pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: security/scan.sh range "${{ github.event.before }}..${{ github.sha }}"
      - name: Scan new branch commits
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          security/scan.sh new-branch "$DEFAULT_BRANCH"
      - name: Scan committed tree
        run: security/scan.sh tree
      - name: Scanner regression tests
        run: bash security/scan-tests.sh
