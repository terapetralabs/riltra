name: release-candidate

# Builds the release-candidate archive of each native target, checks it with a
# clean-install smoke (the shipped binary only, no source tree) and keeps it
# as a workflow artifact. It is started by hand or by a `v*-rc*` tag, and only
# from master: the guard job refuses a manual start from any other branch and a
# tag whose commit is not on master. It never creates a release, a tag, a
# signature or an installer: the v0.1.0 release itself is a separate owner
# decision (design gate D-M9-6).
#
# macOS runs on the x64 pool for the reason recorded in ci.yml; macOS ARM64 is
# not covered by this workflow either. It has its own non-required workflow,
# macos-arm64.yml.
#
# The package runners are pinned to fixed images (windows-2025, ubuntu-24.04,
# macos-15-intel) so that a change of a `-latest` image does not change the
# build that is tested. The guard job keeps ubuntu-latest: it runs no build.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read

jobs:
  guard:
    name: master only
    runs-on: ubuntu-latest
    # Timeouts are 3x the longest job of the two successful runs so far (guard:
    # 7 s), rounded up to 5 minutes, with 5 minutes as the floor. Without one a
    # stalled runner holds a job until GitHub's 6 h default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse any ref other than master
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [ "$GITHUB_REF" = "refs/heads/master" ] && exit 0 ;;
            push)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/master && exit 0 ;;
          esac
          echo "release-candidate runs only from master (event=$GITHUB_EVENT_NAME, ref=$GITHUB_REF)" >&2
          exit 1

  package:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-2025, ext: zip }
          - { name: linux-x64, runner: ubuntu-24.04, ext: tar.gz }
          - { name: macos-x64, runner: macos-15-intel, ext: tar.gz }
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Same rule as `guard`: the longest package job was macos-x64 at 405 s.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked sources for complete SBOM and notices
        run: cargo fetch --locked
      - name: Release build
        run: cargo build --release --locked -p riltra
      - name: Release documents match the locked dependency graph
        run: cargo run --locked -q --example release_docs -- --check
      - name: Package
        shell: bash
        run: bash release/package.sh "${{ matrix.name }}" "${{ matrix.ext }}"
      - name: Clean-install smoke of the archive
        shell: bash
        run: bash release/smoke.sh dist/riltra-*-${{ matrix.name }}.${{ matrix.ext }}
      - uses: actions/upload-artifact@v6
        with:
          name: riltra-${{ matrix.name }}
          path: dist/riltra-*
          if-no-files-found: error

  # Installer acceptance (spec C3) on the archive this run packaged. Each
  # runner downloads its own artifact and runs the same suite that the release
  # scripts ship: test-install.sh on Linux and macOS, test-install.ps1 on
  # Windows. The two Linux runners differ only in their image; the suite
  # itself does not change. The runners are pinned like the package runners.
  acceptance:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, platform: windows-x64, ext: zip }
          - { runner: ubuntu-24.04, platform: linux-x64, ext: tar.gz }
          - { runner: ubuntu-26.04, platform: linux-x64, ext: tar.gz }
          - { runner: macos-15-intel, platform: macos-x64, ext: tar.gz }
    name: acceptance (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Ceiling for the suite on one archive; no build runs here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: riltra-${{ matrix.platform }}
          path: dist
      - name: Installer acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -LiteralPath dist -Filter 'riltra-*-${{ matrix.platform }}.${{ matrix.ext }}' -File)
          if ($archive.Count -ne 1) { throw "expected one archive in dist, found $($archive.Count)" }
          $archivePath = $archive[0].FullName
          pwsh -NoProfile -File release/test-install.ps1 -ArchivePath $archivePath
      - name: Installer acceptance (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash release/test-install.sh --archive dist/riltra-*-${{ matrix.platform }}.${{ matrix.ext }}
